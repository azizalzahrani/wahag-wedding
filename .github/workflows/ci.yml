# AZION OS · does this build.
#
# Added on 16 August 2026, when the dashboard showed that twenty one of thirty
# repositories had no CI at all. Nothing here was tested before it shipped, and
# a green dashboard that only means "nobody is watching" is worse than a red one.
#
# Every step uses --if-present, so this file does not assume scripts that do not
# exist. If a repository later gains a typecheck or a test script, it starts
# being enforced here without anyone editing this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install
        working-directory: .
        run: npm ci || npm install
      - name: Typecheck
        working-directory: .
        run: npm run typecheck --if-present
      # Lint reports but does not block, on purpose. Six of these repositories
      # went red on their first run for pre-existing style issues while building
      # perfectly well, and a red that means "unsorted imports" teaches you to
      # ignore red. Build failures below still fail the run. To make lint
      # blocking again, delete the continue-on-error line.
      - name: Lint
        continue-on-error: true
        working-directory: .
        run: npm run lint --if-present
      - name: Build
        working-directory: .
        run: npm run build --if-present
