  <!-- Typography -->
  <text x="68" y="32" font-family="'Alexandria', 'Cairo', 'Tajawal', sans-serif" font-size="24" font-weight="900" fill="#FAF7F2" letter-spacing="2">وَهَج</text>
  <text x="68" y="47" font-family="'Alexandria', 'Cairo', sans-serif" font-size="9" font-weight="400" fill="#D6C2A5" letter-spacing="1">WAHAJ • ESTUDIO DE LUJO</text>
