<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C9" />
      <stop offset="40%" stop-color="#D6C2A5" />
      <stop offset="70%" stop-color="#C7B08B" />
      <stop offset="100%" stop-color="#8C7351" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6C2A5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0B080C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0B080C" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="42" fill="url(#glow)" />

  <!-- Outer Geometric Star / Octagram Motif -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.9">
    <rect x="25" y="25" width="50" height="50" rx="4" transform="rotate(0 50 50)" />
    <rect x="25" y="25" width="50" height="50" rx="4" transform="rotate(45 50 50)" />
  </g>

  <!-- Inner Sparkle Starburst -->
  <path d="M50 18 L53 43 L78 50 L53 57 L50 82 L47 57 L22 50 L47 43 Z" fill="url(#goldGrad)" />

  <!-- Center Glowing Amber Diamond -->
  <polygon points="50,38 58,50 50,62 42,50" fill="url(#amberGrad)" />
  <circle cx="50" cy="50" r="3" fill="#FFF" />
</svg>